# Nombre fijo del proyecto: los contenedores, la red y el volumen (siniestros-cova_db_data) se llaman
# igual sin importar en qué carpeta se clone el repo. Sin esto, otra carpeta = volumen nuevo y vacío.
name: siniestros-cova

# Conexión a Postgres dentro de la red de Docker (el host es el nombre del servicio: "db").
# Los valores salen del .env de la raíz (ver .env.example); si no existe, se usan los de desarrollo.
x-database-url: &database-url postgresql://${POSTGRES_USER:-cova}:${POSTGRES_PASSWORD:-cova}@db:5432/${POSTGRES_DB:-siniestros}?schema=public

services:
  # Base de datos PostgreSQL (usada por Prisma desde el backend)
  db:
    image: postgres:17-alpine
    container_name: siniestros-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cova}
      POSTGRES_DB: ${POSTGRES_DB:-siniestros}
    ports:
      # Expuesto al host para correr Prisma (migrate dev, studio) desde Windows con localhost:5432.
      # 127.0.0.1 = solo accesible desde la propia máquina. Sin eso, en el VPS quedaría abierto a internet:
      # Docker publica los puertos por encima de ufw.
      - '127.0.0.1:5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Tarea de un solo uso en cada "up": aplica las migraciones pendientes (prisma migrate deploy) y la
  # seed de catálogos (idempotente), y termina. El backend arranca recién si esto terminó bien.
  # Usa la etapa "builder" del Dockerfile del backend porque la imagen final no tiene el CLI de Prisma.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: builder
    container_name: siniestros-migrate
    command:
      ['sh', '-c', 'npm run prisma:migrate:deploy -w backend && node backend/dist/seed-base.mjs']
    environment:
      DATABASE_URL: *database-url
      # Sin el aviso de "nueva versión de Prisma" en los logs de cada deploy
      PRISMA_HIDE_UPDATE_MESSAGE: 'true'
    depends_on:
      db:
        condition: service_healthy

  # API (Express) — se construye desde la raíz porque es un monorepo con workspaces
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: siniestros-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: *database-url
    ports:
      # Solo para pruebas locales: el tráfico real entra por Nginx (frontend) por la red interna de Docker
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Frontend (build de Vite servido por Nginx, que además hace de proxy de /api y /socket.io)
  # También desde la raíz: necesita el package-lock.json del monorepo y el paquete shared/
  # Sin DOMAIN o sin certificado sirve solo HTTP; con certificado, HTTPS (ver frontend/nginx/40-elegir-config.sh).
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: siniestros-frontend
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      # En tu PC: 8080 y 8443. En el VPS, el .env de la raíz los pone en 80 y 443.
      - '${HTTP_PORT:-8080}:80'
      - '${HTTPS_PORT:-8443}:443'
    volumes:
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      # Nginx resuelve "backend" al arrancar: si el backend no está listo, no levanta
      backend:
        condition: service_healthy

  # Certificados SSL de Let's Encrypt (solo en el VPS): intenta renovar cada 12 h; Certbot solo renueva
  # cuando faltan menos de 30 días para el vencimiento. Nginx toma el certificado nuevo al recargar.
  # Está en el perfil "ssl": no arranca salvo que el .env tenga COMPOSE_PROFILES=ssl.
  # El primer certificado se obtiene con scripts/obtener-certificado.sh.
  certbot:
    image: certbot/certbot:v5.8.0
    container_name: siniestros-certbot
    restart: unless-stopped
    profiles: ['ssl']
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done',
      ]
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot

  # Backups diarios de la base y de los documentos a Cloudflare R2 (RNF-04). Solo en el VPS: perfil "backup"
  # (COMPOSE_PROFILES=ssl,backup en el .env). Ver backup/backup.sh.
  # Backup en el momento: sh scripts/backup-ahora.sh. Estado: docker compose exec backup estado
  backup:
    build:
      context: ./backup
    container_name: siniestros-backup
    restart: unless-stopped
    profiles: ['backup']
    # Credenciales de R2 (R2_*): las mismas del backend. Las BACKUP_* pueden estar en cualquiera de los dos
    # archivos; si una variable está en ambos, gana la del .env de la raíz.
    env_file:
      - ./backend/.env
      - path: ./.env
        required: false
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-cova}
      PGPASSWORD: ${POSTGRES_PASSWORD:-cova}
      PGDATABASE: ${POSTGRES_DB:-siniestros}
    volumes:
      # Los dumps de los últimos días también quedan en el VPS (restauración rápida sin descargar)
      - backups_locales:/backups
    # "unhealthy" si el último backup falló o tiene más de 26 h (backup/estado.sh)
    healthcheck:
      test: ['CMD', 'estado']
      interval: 5m
      timeout: 10s
      retries: 1
      # Tiempo para el backup que hace al arrancar si el último tiene más de 24 h
      start_period: 3m
      start_interval: 5s
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  # Certificados y cuenta de Let's Encrypt (sobreviven a los deploys, igual que la base)
  certbot_certs:
  # Archivos temporales de la validación HTTP-01 (los escribe Certbot, los sirve Nginx)
  certbot_www:
  # Dumps de la base de los últimos días (servicio backup)
  backups_locales:
