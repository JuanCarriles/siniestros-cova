# Cabeceras de seguridad básicas para las respuestas del frontend.
# Se incluye en cada location de default.conf porque Nginx no hereda add_header del server
# cuando el location define los suyos. Las respuestas de /api no las llevan: el backend pone las suyas con helmet.
add_header X-Content-Type-Options  "nosniff"     always;
add_header X-Frame-Options         "SAMEORIGIN"  always;
add_header Referrer-Policy         "same-origin" always;
