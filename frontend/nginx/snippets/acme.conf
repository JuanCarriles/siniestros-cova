# Validación de Let's Encrypt (desafío HTTP-01): Certbot deja un archivo en /var/www/certbot y Let's Encrypt
# lo pide por http://DOMINIO/.well-known/acme-challenge/... para comprobar que el dominio apunta a este servidor.
# Va en el server del puerto 80 en los dos modos (también se usa en cada renovación).
location ^~ /.well-known/acme-challenge/ {
    root      /var/www/certbot;
    try_files $uri =404;
}
