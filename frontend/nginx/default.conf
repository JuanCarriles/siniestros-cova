server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # RNF-11: documentos de hasta 10 MB (el default de Nginx es 1 MB → error 413)
    client_max_body_size 10m;

    # Compresión
    gzip             on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_proxied     any;
    gzip_types       text/plain text/css text/javascript
                     application/javascript application/json
                     image/svg+xml;

    # Las cabeceras de seguridad se incluyen en cada location del frontend y no acá a nivel server:
    # un location con su propio add_header no hereda las del server, y /api ya trae las de helmet.

    # ---------------------------------------------------------------- Backend
    # "^~" hace que estas rutas ganen sobre el location por extensión de abajo
    # (si no, /api/documentos/123/foto.jpg se buscaría en disco y daría 404).

    location ^~ /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Socket.IO (chat en tiempo real): necesita el "upgrade" a WebSocket
    location ^~ /socket.io/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # --------------------------------------------------------------- Frontend

    # Assets con hash en el nombre: nunca cambian, se cachean fuerte.
    # "^~" para que no los atrape el location por extensión (que cachea solo 30 días).
    location ^~ /assets/ {
        include    /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files  $uri =404;
    }

    # El index NO se cachea: es el que apunta a los hashes nuevos
    location = /index.html {
        include    /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Routing del SPA: si no existe el archivo, lo resuelve React Router
    location / {
        include   /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Archivos estáticos sueltos (favicon, etc.): si no existen, 404 en lugar del index
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        include    /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        try_files  $uri =404;
    }
}
