# Modo SOLO HTTP: se usa cuando no hay DOMAIN o todavía no existe el certificado.
# Sirve la aplicación por http y responde la validación de Let's Encrypt (para obtener el primer certificado).
# Lo elige 40-elegir-config.sh al arrancar el contenedor.
server {
    listen      80;
    server_name _;

    include /etc/nginx/snippets/acme.conf;
    include /etc/nginx/snippets/app.conf;
}
