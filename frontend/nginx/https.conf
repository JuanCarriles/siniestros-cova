# Modo HTTPS: se usa cuando existe el certificado de ${DOMAIN} (RNF-07).
# 40-elegir-config.sh reemplaza ${DOMAIN} al arrancar el contenedor (las variables de Nginx como $host no se tocan).

# Puerto 80: solo la validación de Let's Encrypt (renovaciones); todo lo demás se redirige a HTTPS.
server {
    listen      80;
    server_name _;

    include /etc/nginx/snippets/acme.conf;

    location / {
        return 301 https://${DOMAIN}$request_uri;
    }
}

server {
    listen      443 ssl;
    http2       on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;

    include /etc/nginx/snippets/app.conf;
}
